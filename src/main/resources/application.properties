spring.application.name=studycafe-reservation

# JSP ViewResolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

server.servlet.session.persistent=false

# DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/studycafedb?useUnicode=true&serverTimezone=Asia/Seoul
spring.datasource.username=ureca
spring.datasource.password=ureca
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema/data init (set to never once DB is seeded)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# MyBatis
mybatis.config-location=classpath:/config/mybatis-config.xml

logging.level.com.ureca=debug
